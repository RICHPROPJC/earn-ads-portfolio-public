<title>AI Product Ads Portfolio - shortlist 14</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --fg:#f2f2f2; --muted:#9aa3b2; --card:#1a1f29; --line:#2a3140; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#12141a; --muted:#5b6575; --card:#fff; --line:#e5e8ee; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, "PingFang HK", "Noto Sans TC", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 28px 20px 8px; max-width: 1200px; margin: 0 auto; }
  header h1 { margin:0 0 8px; font-size: 1.45rem; }
  header p { margin:0; color:var(--muted); font-size: .95rem; line-height:1.5; }
  .grid { max-width:1200px; margin: 16px auto 32px; padding: 0 20px; display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  figure img, figure video { width:100%; aspect-ratio: 1 / 1; object-fit: cover; display:block; background:#111; }
  figure video { aspect-ratio: 9 / 16; max-height: 420px; margin: 0 auto; }
  figcaption { padding:10px 12px 12px; font-size:.86rem; line-height:1.45; color:var(--muted); }
  figcaption strong { color:var(--fg); display:block; margin-bottom:2px; }
  .sheet { max-width:1200px; margin: 0 auto 28px; padding: 0 20px; }
  .sheet img { width:100%; border-radius:12px; display:block; border:1px solid var(--line); }
  .videos { max-width:1200px; margin: 8px auto 28px; padding: 0 20px; display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  h2 { max-width:1200px; margin: 8px auto 0; padding: 0 20px; font-size:1.1rem; }
  footer { max-width:1200px; margin:0 auto 40px; padding:0 20px; color:var(--muted); font-size:.85rem; }
</style>
</head>
